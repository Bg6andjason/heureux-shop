<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HEUREUX - Login &amp; Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- DIN Condensed Alternative (Impact or any strong condensed font as proxy) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FF5722",
                        "background-light": "#ffffff",
                        "background-dark": "#000000",
                        "surface-dark": "#121212",
                        "gray-custom": "#2a2a2a"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "condensed": ["'Barlow Condensed'", "Impact", "sans-serif-condensed", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-din {
            font-family: 'Barlow Condensed', 'Impact', sans-serif-condensed, sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between border-b border-white/10 px-6 py-4 lg:px-12">
<div class="flex items-center gap-2">
<div class="text-primary">
<svg class="w-8 h-8" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-xl font-bold tracking-tighter uppercase">HEUREUX</h2>
</div>
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">search</span>
</button>
<button class="relative p-2 bg-primary/10 text-primary rounded-lg transition-all hover:bg-primary hover:text-white">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-primary text-[10px] font-bold text-white">0</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 py-12 relative overflow-hidden">
<!-- Abstract Background Shapes -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-primary/10 rounded-full blur-3xl"></div>
<div class="w-full max-w-md space-y-8 relative z-10">
<!-- Header Section -->
<div class="text-center space-y-2">
<h1 class="text-5xl lg:text-6xl font-din text-slate-900 dark:text-white">
                    Welcome to <span class="text-primary italic">Heureux</span>
</h1>
<p class="text-slate-500 dark:text-slate-400 font-medium">Elevate your lifestyle with joy.</p>
</div>
<!-- Card Container -->
<div class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/10 rounded-lg shadow-2xl overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-slate-200 dark:border-white/10">
<button class="flex-1 py-4 text-sm font-bold border-b-2 border-primary text-primary transition-all">
                        LOGIN
                    </button>
<button class="flex-1 py-4 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-all">
                        REGISTER
                    </button>
</div>
<!-- Form Content -->
<div class="p-8 space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Email Address</label>
<div class="relative group">
<input class="w-full h-14 bg-slate-50 dark:bg-black border border-slate-200 dark:border-white/20 rounded px-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="name@example.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
<a class="text-xs font-bold text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group flex">
<input class="w-full h-14 bg-slate-50 dark:bg-black border border-slate-200 dark:border-white/20 rounded px-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-4 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary text-white font-din text-2xl rounded shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 tracking-widest">
                        Sign In
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
<span class="flex-shrink mx-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="h-12 flex items-center justify-center border border-slate-200 dark:border-white/20 rounded hover:bg-slate-50 dark:hover:bg-white/5 transition-all group">
<div class="w-5 h-5 mr-2">
<svg viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</div>
<span class="text-xs font-bold uppercase tracking-wider">Google</span>
</button>
<button class="h-12 flex items-center justify-center border border-slate-200 dark:border-white/20 rounded hover:bg-slate-50 dark:hover:bg-white/5 transition-all group">
<span class="material-symbols-outlined mr-2 text-slate-900 dark:text-white">ios</span>
<span class="text-xs font-bold uppercase tracking-wider">Apple</span>
</button>
</div>
</div>
</div>
<!-- Help/Footer -->
<p class="text-center text-xs text-slate-500 dark:text-slate-400">
                By signing in, you agree to our 
                <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<footer class="p-6 text-center border-t border-white/10 bg-black">
<p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">© 2024 HEUREUX CO. ALL RIGHTS RESERVED.</p>
</footer>
</body></html>
